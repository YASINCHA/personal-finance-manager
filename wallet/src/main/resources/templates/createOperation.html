<!DOCTYPE html>
<html >
<head>
    <title>Create Operation</title>
</head>
<body>
    <h1>Create New Operation</h1>
    <form th:action="@{/create}" method="post">
        <label for="operationType">Operation Type:</label>
<select id="operationType" name="operationType" required>
    <option value="+">income</option>
    <option value="-">expense</option>
</select>
        <br>
        <label for="category">Category:</label>
<select id="category" name="category" required>
    <option value="1" th:text="'salary'"></option>
    <option value="2" th:text="'rent'"></option>
    
</select>
        <br>
        <label for="amount">Amount:</label>
        <input type="number" step="0.01" id="amount" name="amount" required>
        <br>
        <button type="submit">Save</button>
    </form>
    <a href="/operations">Back to List</a>
</body>
</html>
