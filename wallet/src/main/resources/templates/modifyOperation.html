<!DOCTYPE html>
<html >
<head>
    <meta charset="UTF-8">
    <title>Modify Operation</title>
    <link rel="stylesheet" th:href="@{/style2.css}">
</head>
<body>
    <h1>Modify Operation</h1>
    <form th:action="@{/modify/{id}(id=${operation.operationId})}" method="post">
        <input type="hidden" th:value="${operation.operationId}" name="id">
        
        <label for="operationType">Operation Type:</label>
<select id="operationType" name="operationType" required>
    <option value="+" th:selected="${operation.operationType == '+'}">income</option>
    <option value="-" th:selected="${operation.operationType == '-'}">expense</option>
</select>
        
        <label for="category">Category:</label>
<select id="category" name="category" required>
    <option value="1" th:text="'salaire'" th:selected="${operation.category == 1}"></option>
    <option value="2" th:text="'loyer'" th:selected="${operation.category == 2}"></option>
    
</select>
        
        <label for="amount">Amount:</label>
        <input type="number" id="amount" name="amount" step="0.01" th:value="${operation.amount}" required>
        
        <button type="submit">Save Changes</button>
    </form>
    <a href="/operations">Back to Operations</a>
</body>
</html>
