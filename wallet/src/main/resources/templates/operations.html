    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

<body>
    

    <main>
        <section>
            <h2>Available Operations</h2>                  

            <table id="operationsTable" >
                <thead>
                    <div style="display: inline-flex; gap: 350px;" >
 <!-- Buttons to open modals directly with margin -->
<div class="d-flex justify-content-between mb-3">

  <!-- Logout Form with Icon and Text -->
<form th:action="@{/wallet/login}" method="get" style="display:inline;">
    <button type="submit" class="btn btn-danger" style="margin-bottom: 20px; margin-left: 800px;">

    </button>
</form>
 <!-- Filter Button -->
<button type="button" class="btn btn-info" id="filterButton">
    <i class="fas fa-filter"></i> Filter
</button>
<!-- Filter Modal -->
<div class="modal fade" id="filterModal" tabindex="-1" aria-labelledby="filterModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="filterModalLabel">Filter Options</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="filterForm">
                    <!-- Column Checkboxes -->
                    <div class="mb-3">
                        <label class="form-label">Columns to Filter:</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="filterOperationId" checked>
                            <label class="form-check-label" for="filterOperationId">Operation ID</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="filterOperationType" checked>
                            <label class="form-check-label" for="filterOperationType">Operation Type</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="filterCategory" checked>
                            <label class="form-check-label" for="filterCategory">Category</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="filterAmount" checked>
                            <label class="form-check-label" for="filterAmount">Amount TND</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="filterCreatedAt" checked>
                            <label class="form-check-label" for="filterCreatedAt">Created At</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="filterUpdatedAt" checked>
                            <label class="form-check-label" for="filterUpdatedAt">Updated At</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="filterAmountSigned" checked>
                            <label class="form-check-label" for="filterAmountSigned">Amount Signed</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="filterAmountCredit" checked>
                            <label class="form-check-label" for="filterAmountCredit">Amount Credit</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="filterAmountDebit" checked>
                            <label class="form-check-label" for="filterAmountDebit">Amount Debit</label>
                        </div>
                    </div>
                    <!-- Filter Value -->
                    <div class="mb-3">
                        <label for="filterValue" class="form-label">Filter Value:</label>
                        <input type="text" id="filterValue" class="form-control">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="applyFilterButton">Apply Filters</button>
            </div>
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const table = document.getElementById('operationsTable');
        const rows = table.querySelectorAll('tbody tr');

        function applyFilters() {
            const filterValue = document.getElementById('filterValue').value.toLowerCase();
            const filterOperationId = document.getElementById('filterOperationId').checked;
            const filterOperationType = document.getElementById('filterOperationType').checked;
            const filterCategory = document.getElementById('filterCategory').checked;
            const filterAmount = document.getElementById('filterAmount').checked;
            const filterCreatedAt = document.getElementById('filterCreatedAt').checked;
            const filterUpdatedAt = document.getElementById('filterUpdatedAt').checked;
            const filterAmountSigned = document.getElementById('filterAmountSigned').checked;
            const filterAmountCredit = document.getElementById('filterAmountCredit').checked;
            const filterAmountDebit = document.getElementById('filterAmountDebit').checked;

            rows.forEach(row => {
                const cells = row.getElementsByTagName('td');
                const matchesFilter = [
                    (!filterOperationId || cells[0].innerText.toLowerCase().includes(filterValue)),
                    (!filterOperationType || cells[1].innerText.toLowerCase().includes(filterValue)),
                    (!filterCategory || cells[2].innerText.toLowerCase().includes(filterValue)),
                    (!filterAmount || cells[3].innerText.toLowerCase().includes(filterValue)),
                    (!filterCreatedAt || cells[5].innerText.toLowerCase().includes(filterValue)),
                    (!filterUpdatedAt || cells[6].innerText.toLowerCase().includes(filterValue)),
                    (!filterAmountSigned || cells[7].innerText.toLowerCase().includes(filterValue)),
                    (!filterAmountCredit || cells[8].innerText.toLowerCase().includes(filterValue)),
                    (!filterAmountDebit || cells[9].innerText.toLowerCase().includes(filterValue)),
                ].every(Boolean);

                row.style.display = matchesFilter ? '' : 'none';
            });
        }

        // Open the filter modal
        document.getElementById('filterButton').addEventListener('click', () => {
            const filterModal = new bootstrap.Modal(document.getElementById('filterModal'));
            filterModal.show();
        });

        // Apply filters when button is clicked
        document.getElementById('applyFilterButton').addEventListener('click', () => {
            applyFilters();
            const filterModal = bootstrap.Modal.getInstance(document.getElementById('filterModal'));
            filterModal.hide();
        });
    });
</script>

                        <td>
<!-- Modify Operation Modal -->
